<style>
body{font-family:'Noto Sans TC','Inter',system-ui,sans-serif;background:#FAFAF7;color:#1A1A1A;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}

<body>
<div class="box">
<h1>404</h1>
<p>找不到此頁面。您要的內容可能在語言切換後的舊網址上。<br>
Page not found — the page may be at an outdated URL after a language switch.</p>
<a href="/index.html" id="go">回到首頁 Back to Home</a>
</div>
<script>
(function(){
  var saved=null;try{saved=localStorage.getItem('ace-lang')}catch(e){}
  if(document.createElement('script')&&history.replaceState===undefined){} /* noop */
  try{location.replace(saved==='zh'?'/index.html?lang=zh':'/index.html')}catch(e){location.replace('/index.html')}
})();
</script>
</body>
